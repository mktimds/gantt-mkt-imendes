name: Atualizar o Gantt

on:
  # De 30 em 30 minutos, dias uteis, das 8h as 18h de Brasilia (11h-21h UTC).
  # Minutos quebrados de proposito: na virada da hora a fila do GitHub e maior
  # e o agendamento costuma atrasar.
  schedule:
    - cron: '7,37 11-21 * * 1-5'
  # Botao "Run workflow" na aba Actions, para atualizar na hora.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ler o Trello e gerar a pagina
        run: node gerar.js
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}

      - name: Empacotar
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar no GitHub Pages
        id: publicacao
        uses: actions/deploy-pages@v4
